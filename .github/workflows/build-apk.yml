name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the required SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile the debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify the artifact exists
        run: |
          set -e
          ls -l app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: artham-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
